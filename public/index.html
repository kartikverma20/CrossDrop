<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossDrop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME -->
  <div id="home" class="view">
    <h1>CrossDrop</h1>
    <p class="sub">Share files on your Wi-Fi. No login.</p>
    <button class="big" id="goSend">
      <span class="icon">⬆️</span>
      <span>Send</span>
    </button>
    <button class="big" id="goReceive">
      <span class="icon">⬇️</span>
      <span>Receive</span>
    </button>
  </div>

  <!-- SEND -->
  <div id="send" class="view hidden">
    <button class="back" id="backFromSend">← Back</button>
    <h2>Send files</h2>
    <div class="panel">
      <label>Receiver's code</label>
      <input type="text" id="toCode" maxlength="4" placeholder="e.g. K7QM" autocomplete="off">

      <label>Files</label>
      <input type="file" id="file" multiple hidden>
      <button class="secondary" id="pickBtn">+ Choose files</button>
      <div id="selected"></div>

      <button class="primary" id="sendBtn">Send</button>
      <p id="status"></p>
    </div>
  </div>

  <!-- RECEIVE -->
  <div id="receive" class="view hidden">
    <button class="back" id="backFromReceive">← Back</button>
    <h2>Receive files</h2>
    <div class="panel center">
      <p>Tell the sender this code</p>
      <div id="myCode" class="code">----</div>
      <p id="timer" class="timer"></p>
    </div>
    <h3>Received files</h3>
    <div id="list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
